<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OSM</title>
    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />

    <link rel="stylesheet" href="css/mycss02.css" />
    <link rel="stylesheet" href="css/table-rwd.css" />
  </head>
  <body>
    <div class="section vh-100 bg-success" id="map"></div>

    <div class="card" style="width: 18rem">
      <img
        src="https://ezgo.ardswc.gov.tw/_api/content/images/agrispots/25819/480x360_agrispots-image--i0uqxsgseicmbf12-ztpa.jpg"
        alt=""
      />
      <div class="card-body">
        <h5 class="card-title">xxx餐廳</h5>
        <p class="card-text">地址：XXX</p>
        <p class="card-text">電話：XXX</p>
        <a href="#" class="btn btn-danger w-100">官網</a>
      </div>
    </div>
    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/jquery-4.0.0.js"></script>
    <script src="js/travelData.js"></script>
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script>
      $(function () {
        console.log(travelData);
        var map = L.map("map").setView([24.17122, 120.609633], 8);

        L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
          attribution:
            '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
        }).addTo(map);

        travelData.forEach((item) => {
          console.log(item.Latitude);
          console.log(item.Longitude);
          if (!item.Latitude || !item.Longitude) {
            return;
          }
          const lat_lng = [item.Latitude, item.Longitude];
          const strHTML = `<div class="card" style="width: 18rem">
      <img src="${item.PicURL}" alt="">
      <div class="card-body">
        <h5 class="card-title">${item.Name}</h5>
        <p class="card-text">地址：${item.City} + ${item.Town} + ${item.Address}</p>
        <p class="card-text">電話：${item.Tel}</p>
        <a href="${item.Url}" class="btn btn-danger w-100">官網</a>

      </div>
    </div>`;

          L.marker(lat_lng).addTo(map).bindPopup(strHTML);
        });
      });

      //   L.marker([24.17122, 120.609633])
      //     .addTo(map)
      //     .bindPopup("J200教室")
      //     // .openPopup();
      //   L.marker([24.171615, 120.609508])
      //     .addTo(map)
      //     .bindPopup("H101教室")
      //     // .openPopup();
    </script>
  </body>
</html>
