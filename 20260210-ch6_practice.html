<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ch6-Practice</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/mycss02.css">
    <style>
        .box01 {
            height: 120px;
            font-size: 60px;
            margin-top: 20px;
            line-height: 120px;
        }
        .roller{
            position: relative;
            overflow: hidden;
        }
        .roller .roller_box01{
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.3);
            top:-100%;
        }
        .roller:hover .roller_box01{
            top: 0;
            transition: top 2s;
        }
        .roller .roller_box02{
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.3);
            bottom: -100%;
        }
        .roller:hover .roller_box02{
            bottom: 0;
            transition: bottom 2s;
        }
        .roller .roller_box03{
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.3);
            right: -100%;
        }
        .roller:hover .roller_box03{
            right: 0;
            transition: right 2s;
        }
        .roller .roller_box04{
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.3);
            left:-100%;
        }
        .roller:hover .roller_box04{
            left: 0;
            transition: left 2s;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="row">
            <div class="col-12 d-md-none d-lg-block">
                <div class="box01 bg-success text-center fw-600">header</div>
            </div>
        </div>
        <div class="row">
            <div class="col-sm-6 col-md-4 col-xxl-2">
                <div class="box01 bg-warning text-center fw-600 roller">
                    <div class="roller_box01">
                        01
                    </div>
                </div>
            </div>
            <div class="col-sm-6 col-md-4 col-xxl-2">
                <div class="box01 bg-warning text-center fw-600 roller">
                    <div class="roller_box02">
                        02
                    </div>
                </div>
            </div>
            <div class="col-sm-6 col-md-4 col-xxl-2">
                <div class="box01 bg-warning text-center fw-600">03</div>
            </div>
            <div class="col-sm-6 col-md-4 col-xxl-2">
                <div class="box01 bg-warning text-center fw-600 roller">
                    <div class="roller_box03">
                        04
                    </div></div>
            </div>
            <div class="col-sm-6 col-md-4 col-xxl-2">
                <div class="box01 bg-warning text-center fw-600">05</div>
            </div>
            <div class="col-sm-6 col-md-4 col-xxl-2">
                <div class="box01 bg-warning text-center fw-600 roller">
                    <div class="roller_box04">
                        06
                    </div>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-md-6 col-xl-3">
                <div class="box01 bg-danger text-center fw-600">01</div>
            </div>
            <div class="col-md-6 col-xl-3">
                <div class="box01 bg-danger text-center fw-600">02</div>
            </div>
            <div class="col-md-6 col-xl-3">
                <div class="box01 bg-danger text-center fw-600">03</div>
            </div>
            <div class="col-md-6 col-xl-3">
                <div class="box01 bg-danger text-center fw-600">04</div>
            </div>
            <div class="col-md-6 col-xl-3">
                <div class="box01 bg-danger text-center fw-600">05</div>
            </div>
            <div class="col-md-6 col-xl-3">
                <div class="box01 bg-danger text-center fw-600">06</div>
            </div>
            <div class="col-md-6 col-xl-3">
                <div class="box01 bg-danger text-center fw-600">07</div>
            </div>
            <div class="col-md-6 col-xl-3">
                <div class="box01 bg-danger text-center fw-600">08</div>
            </div>
        </div>
        <div class="row">
            <div class="col-12 d-md-none d-lg-block">
                <div class="box01 bg-info text-center fw-600">footer</div>
            </div>
        </div>

    </div>


    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/jquery-4.0.0.js"></script>
</body>

</html>
