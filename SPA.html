<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SPA Practice</title>

    <!-- CDN 替換本地資源，方便獨立預覽 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet" />

    <style>
      :root {
        --ink:      #0e0e0e;
        --surface:  #141414;
        --panel:    #1c1c1c;
        --border:   rgba(255,255,255,0.07);
        --gold:     #c9a84c;
        --gold-dim: rgba(201,168,76,0.15);
        --text:     #d4d4d4;
        --text-muted: #6b6b6b;
        --radius:   6px;
      }

      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      html { scroll-behavior: smooth; }

      body {
        background: var(--ink);
        color: var(--text);
        font-family: 'Noto Sans TC', sans-serif;
        font-weight: 300;
        line-height: 1.7;
      }

      /* ─── s01 社群列 ─── */
      #s01 {
        background: var(--surface);
        border-bottom: 1px solid var(--border);
      }
      #s01 .container { padding-top: .6rem; padding-bottom: .6rem; }
      #s01 a {
        display: inline-flex;
        align-items: center;
        color: var(--text-muted);
        margin-left: .9rem;
        transition: color .2s;
      }
      #s01 a:hover { color: var(--gold); }
      #s01 .fa-line { color: #06c755 !important; opacity: .75; }
      #s01 .fa-line:hover { opacity: 1; }

      /* ─── s02 Navbar ─── */
      #s02 { background: var(--surface); }

      .navbar {
        background: var(--surface) !important;
        border-bottom: 1px solid var(--border);
        padding: .9rem 0;
      }
      .navbar-brand {
        font-family: 'Playfair Display', serif;
        font-size: 1.4rem;
        color: var(--gold) !important;
        letter-spacing: .06em;
      }
      .nav-link {
        color: var(--text-muted) !important;
        font-size: .85rem;
        letter-spacing: .08em;
        text-transform: uppercase;
        padding: .4rem .9rem !important;
        transition: color .2s;
      }
      .nav-link:hover, .nav-link.active { color: #fff !important; }

      .dropdown-menu {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: .4rem 0;
        min-width: 160px;
      }
      .dropdown-item {
        color: var(--text-muted);
        font-size: .84rem;
        letter-spacing: .04em;
        padding: .5rem 1.1rem;
        transition: background .15s, color .15s;
      }
      .dropdown-item:hover {
        background: var(--gold-dim);
        color: var(--gold);
      }
      .dropdown-divider { border-color: var(--border); }

      /* Navbar buttons */
      .btn-outline-warning {
        border-color: var(--gold);
        color: var(--gold);
        font-size: .8rem;
        letter-spacing: .1em;
        padding: .38rem 1rem;
        border-radius: var(--radius);
        transition: background .2s, color .2s;
      }
      .btn-outline-warning:hover {
        background: var(--gold);
        color: var(--ink);
      }
      .btn-success {
        background: var(--gold);
        border: none;
        color: var(--ink);
        font-size: .8rem;
        font-weight: 500;
        letter-spacing: .1em;
        padding: .38rem 1rem;
        border-radius: var(--radius);
        transition: opacity .2s;
      }
      .btn-success:hover { opacity: .85; background: var(--gold); }

      /* ─── s03 Hero ─── */
      #s03 {
        min-height: 88vh;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        overflow: hidden;
        background:
          radial-gradient(ellipse 80% 60% at 50% 110%, rgba(201,168,76,0.08) 0%, transparent 70%),
          var(--ink);
      }

      /* 裝飾線條 */
      #s03::before {
        content: '';
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(var(--border) 1px, transparent 1px),
          linear-gradient(90deg, var(--border) 1px, transparent 1px);
        background-size: 80px 80px;
        opacity: .4;
      }

      .hero-inner {
        position: relative;
        z-index: 1;
        text-align: center;
        max-width: 680px;
        padding: 2rem;
      }
      .hero-tag {
        display: inline-block;
        font-size: .72rem;
        letter-spacing: .22em;
        text-transform: uppercase;
        color: var(--gold);
        border: 1px solid var(--gold-dim);
        padding: .28rem .9rem;
        border-radius: 20px;
        margin-bottom: 1.6rem;
      }
      .hero-title {
        font-family: 'Playfair Display', serif;
        font-size: clamp(2.4rem, 6vw, 4.2rem);
        line-height: 1.15;
        color: #fff;
        margin-bottom: 1.2rem;
      }
      .hero-title span { color: var(--gold); }
      .hero-sub {
        font-size: .95rem;
        color: var(--text-muted);
        max-width: 420px;
        margin: 0 auto 2.4rem;
        line-height: 1.8;
      }
      .hero-cta {
        display: inline-flex;
        gap: .8rem;
        flex-wrap: wrap;
        justify-content: center;
      }
      .hero-cta .btn-primary {
        background: var(--gold);
        border: none;
        color: var(--ink);
        font-weight: 500;
        padding: .7rem 1.8rem;
        border-radius: var(--radius);
        font-size: .88rem;
        letter-spacing: .06em;
        transition: opacity .2s;
      }
      .hero-cta .btn-primary:hover { opacity: .85; }
      .hero-cta .btn-ghost {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--text-muted);
        padding: .7rem 1.8rem;
        border-radius: var(--radius);
        font-size: .88rem;
        letter-spacing: .06em;
        cursor: pointer;
        transition: border-color .2s, color .2s;
        text-decoration: none;
      }
      .hero-cta .btn-ghost:hover {
        border-color: rgba(255,255,255,0.25);
        color: #fff;
      }

      /* 裝飾徽章 */
      .badge-float {
        position: absolute;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: .2rem;
        font-size: .7rem;
        letter-spacing: .1em;
        color: var(--text-muted);
        text-transform: uppercase;
        opacity: .45;
      }
      .badge-float::before {
        content: '';
        width: 1px;
        height: 60px;
        background: var(--border);
      }
      .badge-float-l { left: 5%; bottom: 12%; }
      .badge-float-r { right: 5%; bottom: 12%; }

      /* ─── Modals ─── */
      .modal-content {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        overflow: hidden;
        color: var(--text);
      }
      .modal-header {
        background: var(--surface) !important;
        border-bottom: 1px solid var(--border);
        padding: 1.1rem 1.4rem;
      }
      .modal-header.text-bg-warning {
        background: var(--gold-dim) !important;
        border-bottom: 1px solid rgba(201,168,76,0.2) !important;
      }
      .modal-title {
        font-family: 'Playfair Display', serif;
        font-size: 1.05rem !important;
        color: var(--gold) !important;
        letter-spacing: .06em;
      }
      .btn-close { filter: invert(1) brightness(.6); }
      .modal-body { padding: 1.6rem; }
      .modal-footer {
        border-top: 1px solid var(--border);
        padding: 1rem 1.4rem;
        gap: .5rem;
      }
      .form-label {
        font-size: .8rem;
        letter-spacing: .1em;
        text-transform: uppercase;
        color: var(--text-muted);
        margin-bottom: .5rem;
      }
      .form-control {
        background: var(--surface);
        border: 1px solid var(--border);
        color: #fff;
        border-radius: var(--radius);
        padding: .6rem .9rem;
        font-size: .88rem;
      }
      .form-control:focus {
        background: var(--surface);
        border-color: var(--gold);
        color: #fff;
        box-shadow: 0 0 0 3px rgba(201,168,76,0.12);
      }
      .modal-footer .btn-secondary {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--text-muted);
        font-size: .82rem;
        letter-spacing: .06em;
        border-radius: var(--radius);
        transition: border-color .2s, color .2s;
      }
      .modal-footer .btn-secondary:hover {
        border-color: rgba(255,255,255,0.2);
        color: #fff;
      }
      .modal-footer .btn-primary {
        background: var(--gold);
        border: none;
        color: var(--ink);
        font-size: .82rem;
        font-weight: 500;
        letter-spacing: .08em;
        border-radius: var(--radius);
        transition: opacity .2s;
      }
      .modal-footer .btn-primary:hover { opacity: .85; }

      /* ─── Scrollbar ─── */
      ::-webkit-scrollbar { width: 5px; }
      ::-webkit-scrollbar-track { background: var(--ink); }
      ::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 3px; }
    </style>
  </head>
  <body>

    <!-- s01 社群連結 -->
    <section id="s01" class="bg-secondary">
      <div class="container">
        <div class="text-end py-3">
          <a href="#" class="text-decoration-none">
            <i class="fa-brands fa-square-facebook fa-2x"></i>
          </a>
          <a href="#" class="text-decoration-none">
            <i class="fa-brands fa-line fa-3x text-success"></i>
          </a>
          <a href="#" class="text-decoration-none">
            <i class="fa-brands fa-square-x-twitter fa-2x text-dark"></i>
          </a>
          <a href="#" class="text-decoration-none">
            <i class="fa-brands fa-instagram fa-2x text-dark"></i>
          </a>
          <a href="#" class="text-decoration-none">
            <i class="fa-brands fa-threads fa-2x text-dark"></i>
          </a>
        </div>
      </div>
    </section>

    <!-- s02 選單 -->
    <section id="s02" class="bg-dark"></section>
    <div class="container">
      <nav class="navbar navbar-expand-lg bg-dark navbar-dark">
        <div class="container-fluid">
          <a class="navbar-brand" href="#">Navbar</a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarSupportedContent"
            aria-controls="navbarSupportedContent"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="#">Home</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#">Link</a>
              </li>
              <li class="nav-item dropdown">
                <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                  Dropdown
                </a>
                <ul class="dropdown-menu">
                  <li><a class="dropdown-item" href="#">Action</a></li>
                  <li><a class="dropdown-item" href="#">Another action</a></li>
                  <li><hr class="dropdown-divider" /></li>
                  <li><a class="dropdown-item" href="#">Something else here</a></li>
                </ul>
              </li>
              <li class="nav-item">
                <a class="nav-link disabled">Disabled</a>
              </li>
            </ul>
            <div>
              <button class="btn btn-outline-warning" data-bs-toggle="modal" data-bs-target="#registerModal">
                註冊
              </button>
              <button class="btn btn-success ms-2" data-bs-toggle="modal" data-bs-target="#loginModal">
                Login
              </button>
            </div>
          </div>
        </div>
      </nav>
    </div>

    <!-- s03 Hero（原 carousel 區域） -->
    <section id="s03">
      <div class="hero-inner">
        <span class="hero-tag">SPA Practice &nbsp;·&nbsp; Bootstrap 5</span>
        <h1 class="hero-title">Build Something<br /><span>Remarkable</span></h1>
        <p class="hero-sub">
          一個乾淨、有個性的起點。從這裡展開你的每一個前端練習。
        </p>
        <div class="hero-cta">
          <button class="btn-primary" data-bs-toggle="modal" data-bs-target="#registerModal">
            立即註冊
          </button>
          <a href="#" class="btn-ghost">了解更多 →</a>
        </div>
      </div>

      <div class="badge-float badge-float-l">scroll</div>
      <div class="badge-float badge-float-r">2026</div>
    </section>

    <!-- registerModal -->
    <div class="modal fade" id="registerModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true" style="display: none;">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header text-bg-warning">
            <h1 class="modal-title fs-5 h1" id="exampleModalLabel">Register</h1>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <div class="mb-3">
              <label for="" class="form-label">Account</label>
              <input type="text" class="form-control" placeholder="Enter your email" />
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="button" class="btn btn-primary">Confirm</button>
          </div>
        </div>
      </div>
    </div>

    <!-- loginModal -->
    <div class="modal fade" id="loginModal" tabindex="-1" aria-labelledby="exampleModelLabel" style="display: none;" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header text-bg-warning">
            <h1 class="modal-title fs-5 h1" id="exampleModalLabel">Login</h1>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <div class="mb-3">
              <label for="" class="form-label">Account</label>
              <input type="text" class="form-control" placeholder="Enter your email" />
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="button" class="btn btn-primary">Confirm</button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  </body>
</html>
