<!doctype html>

    <link rel="stylesheet" href="../css/bootstrap.min.css">
    <link rel="stylesheet" href="../css/mycss02.css" />
    <style>
      body {
        background-color: var(--cork02);
        margin: 0;
        padding: 0;
      }
      .section01 {
        height: 100vh;
        position: relative;
        background-color: var(--cork01);
      }
      .section01 .box01 {
        width: 200px;
        height: 200px;
        background-color: var(--cork12);
        position: absolute;
        top: 0;
        right: 0;
      }
      .section01 .box02 {
        width: 200px;
        height: 200px;
        background-color: var(--cork12);
        position: absolute;
        top: 0;
        left: 0;
      }
      .section01 .box03 {
        width: 200px;
        height: 200px;
        background-color: var(--cork12);
        position: absolute;
        bottom: 0;
        left: 0;
      }
      .section01 .box04 {
        width: 200px;
        height: 200px;
        background-color: var(--cork12);
        position: absolute;
        bottom: 0;
        right: 0;
      }
      .userimg {
        position: absolute;
        top: 100px;
        bottom: 100px;
        left: 100px;
        right: 100px;
        background-color: var(--cork08);
        background-image: url(images/cat-5.jpg);
        background-size: cover;
        background-position: 0 0;
      }
      .usertext {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background-color: rgba(0, 0, 0, 0.15);
        color: var(--cork02);
        text-align: center;
        padding: 20px;
        border-radius: 25px;
        box-shadow: 1px 1px 2px 1px var(--cork01);
      }
      .usertext h1 {
        font-size: 80px;
        margin-bottom: 0;
      }
      .usertext h2 {
        font-size: 40px;
        margin-top: 10px;
        margin-bottom: 10px;
      }
      .usertext p {
        font-size: 20px;
      }
      .section02 {
        position: relative;
        height: 400px;
        background-color: var(--cork03);
      }
      .section02 .box01 {
        position: absolute;
        width: 320px;
        height: 320px;
        border-radius: 50%;
        left: 10%;
        top: 20%;
        background-color: var(--cork08);
        line-height: 250px;
        text-align: center;
        background-image: url(../images/cat-3.jpg);
        background-size: cover;
        background-position: -100px 0;
        /* background-image: linear-gradient(180deg, rgba(0,0,0,0),rgba(0,0,0,0.8)); */
      }
      .section02 a {
        text-decoration: none;
        color: var(--cork17);
        font-size: 40px;
        background-color: rgba(255, 255, 255, 0.2);
        box-shadow: 1px 1px 2px 1px var(--cork01);
      }
      .section02 .box02 {
        position: absolute;
        width: 320px;
        height: 320px;
        border-radius: 50%;
        left: 40%;
        top: 20%;
        background-color: var(--cork08);
        line-height: 250px;
        text-align: center;
        background-image: url(images/cat-2.jpg);
        background-size: cover;
        background-position: center;
        /* background-image: linear-gradient(180deg, rgba(0,0,0,0),rgba(0,0,0,0.8)); */
      }
      .section02 .box03 {
        position: absolute;
        width: 320px;
        height: 320px;
        border-radius: 50%;
        right: 10%;
        top: 20%;
        background-color: var(--cork02);
        line-height: 250px;
        text-align: center;
        background-image: url(images/cat-4.jpg);
        background-size: cover;
        background-position: 0 0;
        /* background-image: linear-gradient(180deg, rgba(0,0,0,0),rgba(0,0,0,0.8)); */
      }

      <div class="box02"></div>
      <div class="box03"></div>
      <div class="box04"></div>
      <div class="userimg"></div>
      <div class="usertext">
        <h1>Tako CHANG</h1>
        <hr />
        <h2>認真負責</h2>
        <p>
          認真負責、樂於學習、善於溝通。以專業態度面對每個挑戰，期待為團隊帶來正面影響。
        </p>
      </div>
    </div>
